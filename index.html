<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Construction</title>
  
  <!-- Подключение шрифтов из @lonely_tiger -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-onyx: #0B0C0E;
      --graphite: #1A1D24;
      --gold-matte: #C5A059;
      --platinum: #E2E4E8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-onyx);
      color: var(--platinum);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Фоновое мягкое студийное свечение */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.07) 0%, rgba(11, 12, 14, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      text-align: center;
      max-width: 680px;
      padding: 3rem 2.5rem;
      border: 1px solid rgba(197, 160, 89, 0.2);
      background: linear-gradient(180deg, rgba(26, 29, 36, 0.6) 0%, rgba(11, 12, 14, 0.8) 100%);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .brand-eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold-matte);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.25;
      color: var(--platinum);
    }

    .divider {
      width: 48px;
      height: 1px;
      background-color: var(--gold-matte);
      margin: 1.75rem auto 1.5rem auto;
      opacity: 0.8;
    }

    p {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: rgba(226, 228, 232, 0.65);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Site Under Construction</h1>
  </div>

</body>
</html>
